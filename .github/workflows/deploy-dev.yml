name: Deploy Dev to GitHub Pages

on:
  push:
    branches:
      - "claude/**"
      - "dev"
      - "develop"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (dev)
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          NEXT_PUBLIC_ENV: development
        run: npm run build

      - name: Prepare deploy directory
        run: |
          mkdir -p deploy/dev
          cp -r out/* deploy/dev/
          touch deploy/.nojekyll

          # Create landing page
          cat > deploy/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html>
          <head><meta charset="utf-8"><title>EasyPrint 3D</title>
          <style>
            body { font-family: system-ui; background: #0a0a1a; color: #eee; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
            .container { text-align: center; }
            a { color: #60a5fa; text-decoration: none; display: inline-block; margin: 12px; padding: 12px 24px; border: 1px solid #333; border-radius: 8px; transition: all 0.2s; }
            a:hover { background: #1e3a5f; border-color: #60a5fa; }
            h1 { margin-bottom: 8px; }
            p { color: #888; margin-bottom: 24px; }
          </style>
          </head>
          <body>
            <div class="container">
              <h1>EasyPrint 3D</h1>
              <p>Web-based 3D modeling application</p>
              <a href="./dev/">Dev Version</a>
            </div>
          </body>
          </html>
          HTMLEOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          keep_files: true
